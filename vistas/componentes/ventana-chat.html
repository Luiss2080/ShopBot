<div class="contenedor-ventana-chat">
    <div class="encabezado-chat">
        <h2 class="titulo-chat">Asistente Virtual</h2>
        <button class="boton-minimizar" aria-label="Minimizar chat">−</button>
    </div>
    <div class="area-mensajes" id="area-mensajes">
        <!-- Los mensajes se cargarán dinámicamente aquí -->
    </div>
    <div class="area-entrada">
        <input 
            type="text" 
            id="entrada-mensaje" 
            class="campo-entrada" 
            placeholder="Escribe tu mensaje..."
            autocomplete="off"
        >
        <button class="boton-enviar" id="boton-enviar">
            Enviar
        </button>
    </div>
</div>
